<!doctype html>
<html lang="ko">
<head>

<title>메모 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Figma 변수 */
  :root {
    --color-primary: #3182f6;
    --surface-page: #f2f4f6;
    --surface-card: #ffffff;
    --text-primary: #191f28;
    --text-secondary: #4e5968;
    --text-muted: #8b95a1;
    --text-on-primary: #ffffff;
    --label-blue-soft: #e8f3ff;
    --label-green-soft: #e3f8ec;
    --label-orange-soft: #fff1e5;
    --label-pink-soft: #ffeaf1;
    --space-4: 4px;
    --space-8: 8px;
    --space-12: 12px;
    --space-16: 16px;
    --space-20: 20px;
    --space-24: 24px;
    --space-34: 34px;
    --space-64: 64px;
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-xl: 24px;
    --radius-full: 999px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--surface-page); }
  body {
    font-family: "Noto Sans KR", sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; border: 0; background: none; cursor: pointer; color: inherit; }
  a { color: inherit; text-decoration: none; }
  img { display: block; }

  /* Figma 텍스트 스타일 */
  .t-heading-xl { font-size: 28px; font-weight: 700; line-height: 38px; letter-spacing: -0.8px; }
  .t-title-md   { font-size: 17px; font-weight: 700; line-height: 24px; letter-spacing: -0.3px; }
  .t-button-md  { font-size: 17px; font-weight: 700; line-height: 24px; letter-spacing: -0.2px; }
  .t-label-md   { font-size: 15px; font-weight: 700; line-height: 22px; letter-spacing: -0.2px; }
  .t-caption-md { font-size: 15px; font-weight: 500; line-height: 22px; letter-spacing: -0.2px; }
  .t-body-sm    { font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: -0.1px; }
  .t-caption-sm { font-size: 13px; font-weight: 500; line-height: 18px; letter-spacing: 0; }

  /* 화면 (완성 예시/Home) */
  .screen {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
    padding: var(--space-64) var(--space-16) calc(var(--space-34) + env(safe-area-inset-bottom, 0px));
    background: var(--surface-page);
  }
  .main { flex: 1 0 auto; display: flex; flex-direction: column; gap: var(--space-16); }

  /* Header */
  .header { display: flex; flex-direction: column; gap: var(--space-8); padding: 0 var(--space-8); }
  .header__date { color: var(--text-muted); }
  .header__title { color: var(--text-primary); }
  .header__count { color: var(--color-primary); }

  /* Filter / Chip */
  .filter { display: flex; gap: var(--space-8); padding: 0 var(--space-4); }
  .chip {
    flex-shrink: 0;
    height: 36px;
    display: flex;
    align-items: center;
    padding: 0 var(--space-16);
    border-radius: var(--radius-full);
    background: var(--surface-card);
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--color-primary); color: var(--text-on-primary); }

  /* Card */
  .card {
    display: flex;
    flex-direction: column;
    padding: var(--space-8) 0;
    border-radius: var(--radius-xl);
    background: var(--surface-card);
  }

  /* Card/Header */
  .card-header {
    height: 40px;
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-12) var(--space-16) var(--space-4) var(--space-20);
  }
  .card-header__title { flex: 1 1 0; min-width: 0; color: var(--text-primary); }
  .card-header__action { display: flex; align-items: center; gap: var(--space-4); color: var(--text-muted); white-space: nowrap; }

  /* Memo/Item */
  .memo {
    height: 72px;
    display: flex;
    align-items: center;
    gap: var(--space-16);
    padding: var(--space-12) var(--space-20);
  }
  .memo__tile {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
  }
  .memo__tile--blue   { background: var(--label-blue-soft); }
  .memo__tile--green  { background: var(--label-green-soft); }
  .memo__tile--orange { background: var(--label-orange-soft); }
  .memo__tile--pink   { background: var(--label-pink-soft); }
  .memo__content { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--space-4); }
  .memo__title { color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .memo__preview { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .memo__date { flex-shrink: 0; color: var(--text-muted); white-space: nowrap; }

  /* Button/Primary: 화면 아래에 붙는다 */
  .btn-primary {
    position: sticky;
    bottom: calc(var(--space-34) + env(safe-area-inset-bottom, 0px));
    flex-shrink: 0;
    width: 100%;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-8);
    padding: 0 var(--space-24);
    border-radius: var(--radius-md);
    background: var(--color-primary);
    color: var(--text-on-primary);
    white-space: nowrap;
  }
</style>
</head>
